{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<h2>로그인</h2>
<form method="post" novalidate>
  {{ form.csrf_token }}
  <label>{{ form.username.label }}
    {{ form.username(maxlength=20, autocomplete="username") }}
  </label>
  <label>{{ form.password.label }}
    {{ form.password(maxlength=128, autocomplete="current-password") }}
  </label>
  {{ form.submit() }}
</form>
<p class="muted">계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a></p>
{% endblock %}
